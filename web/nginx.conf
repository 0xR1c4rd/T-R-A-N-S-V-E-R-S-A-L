server {
    listen 80;
    root /usr/share/nginx/html;
    index index.html;

    # React Router gère les routes côté navigateur (/collection, /stats...).
    # Si le fichier demandé n'existe pas, on renvoie index.html pour que
    # le rechargement de la page sur /collection ne donne pas une erreur 404.
    location / {
        try_files $uri /index.html;
    }
}